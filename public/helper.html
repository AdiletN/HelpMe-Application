<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Helper profile — HelpMe</title><link rel="stylesheet" href="css/style.css"></head><body><div id="nav"></div><main class="main"><div class="container narrow"><div class="page-head"><div><div class="eyebrow">STUDY BUDDY</div><h1>Helper profile</h1><p class="sub">See topics, weekly availability and peer reviews.</p></div><a href="helpers.html" class="btn secondary">← Back to helpers</a></div><div id="content"><div class="card muted">Loading profile…</div></div></div></main><script src="js/api.js"></script><script>
requireLogin();renderNav('helpers.html');const id=new URLSearchParams(location.search).get('id');
(async()=>{try{if(!id)throw Error('Choose a helper in Find Helpers.');const h=await api('/helpers/'+encodeURIComponent(id));const groups={};h.offers.forEach(o=>(groups[o.course_name] ||= []).push(o));$('content').innerHTML=`<section class="card"><div class="inline" style="align-items:center;gap:19px">${avatar(h.full_name,'xl')}<div><h2 class="mb0">${esc(h.full_name)}</h2><div class="muted">${esc(h.university)} · Year ${h.year}</div><div class="mt12"><span class="badge spec">${esc(h.specialization)}</span> <span class="stars">★ ${h.rating||'New'}</span> <span class="muted tiny">(${h.review_count} reviews)</span></div></div></div><hr class="line"><div class="spread"><h2>Topics I can explain</h2></div>${Object.entries(groups).map(([course,topics])=>`<h3>${esc(course)}</h3><div class="topics">${topics.map(t=>`<span class="chip plain">${esc(t.topic_name)}</span>`).join('')}</div>`).join('')}<hr class="line"><h2>Weekly availability</h2><div class="topics">${h.availability.map(a=>`<span class="chip green">${icon('clock')} ${esc(a.day)} ${esc(a.start_time)}–${esc(a.end_time)}</span>`).join('')}</div><div class="note">Choose a date that falls on one of these days and a time inside a listed slot.</div><a href="need-help.html?helper=${h.user_id}" class="btn mt18">Request help from ${esc(h.full_name.split(' ')[0])} ${icon('arrow')}</a></section><section class="card mt18"><h2>Peer reviews</h2>${h.reviews.length?h.reviews.map(r=>`<div class="rating-row">${avatar(r.reviewer_name)}<div><b>${esc(r.reviewer_name)}</b> <span class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span><p class="muted tiny">${esc(r.feedback||'Help session completed.')}</p></div></div>`).join(''):'<p class="muted">No ratings yet. Be the first to learn with this student!</p>'}</section>`}catch(e){$('content').innerHTML=emptyState('Helper profile not available',e.message,'helpers.html','Browse helpers')}})();
</script></body></html>

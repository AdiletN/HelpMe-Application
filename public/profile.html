<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My profile — HelpMe</title><link rel="stylesheet" href="css/style.css"></head><body><div id="nav"></div><main class="main"><div class="container narrow"><div class="page-head"><div><div class="eyebrow">YOUR IDENTITY</div><h1>My profile</h1><p class="sub">Manage your information and see your contribution to HelpMe.</p></div><a href="offer-help.html" class="btn secondary">Edit help offer</a></div><section class="card"><div class="inline"><div id="myAvatar"></div><div><h2 id="myName" class="mb0">Student</h2><span id="myUni" class="muted">University</span></div></div><hr class="line"><form id="form"><h2>Personal information</h2><label for="full_name">Full name</label><input id="full_name" minlength="2" maxlength="80" required><label for="email">Email address</label><input id="email" readonly><div class="row"><div><label for="university">University</label><input id="university" required maxlength="100"></div><div><label for="year">Study year</label><select id="year" required><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div></div><label for="spec">Specialization <span class="lock">· cannot be changed</span></label><input id="spec" readonly><div id="msg" class="msg"></div><button class="btn mt18">Save changes →</button></form></section><section class="card mt18"><div class="spread"><h2>What I can teach</h2><a href="offer-help.html" class="tiny semi">Edit topics →</a></div><div id="offers" class="muted">Loading…</div><hr class="line"><h2>My weekly availability</h2><div id="availability" class="topics"></div></section><section class="card mt18"><h2>Reviews from students</h2><div id="reviews" class="muted">Loading…</div></section></div></main><script src="js/api.js"></script><script>
requireLogin();renderNav('profile.html');
async function load(){try{const d=await api('/profile');const u=d.user;localStorage.setItem('helpme_user',JSON.stringify(u));$('myName').textContent=u.full_name;$('myUni').textContent=`${u.university} · Year ${u.year}`;$('myAvatar').innerHTML=avatar(u.full_name,'xl');$('full_name').value=u.full_name;$('email').value=u.email;$('university').value=u.university;$('year').value=u.year;$('spec').value=u.specialization;const grouped={};d.offers.forEach(o=>(grouped[o.course_name] ||= []).push(o.topic_name));$('offers').innerHTML=Object.keys(grouped).length?Object.entries(grouped).map(([c,topics])=>`<h3 class="mt18">${esc(c)}</h3><div class="topics">${topics.map(t=>`<span class="chip plain">${esc(t)}</span>`).join('')}</div>`).join(''):'<p class="muted">You have not selected any topics yet.</p>';$('availability').innerHTML=d.availability.length?d.availability.map(a=>`<span class="chip green">${esc(a.day)} ${esc(a.start_time)}–${esc(a.end_time)}</span>`).join(''):'<span class="muted">No weekly availability saved.</span>';$('reviews').innerHTML=d.reviews.length?d.reviews.map(r=>`<div class="rating-row">${avatar(r.reviewer_name)}<div><b>${esc(r.reviewer_name)}</b> <span class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span><p class="muted tiny">${esc(r.feedback||'Helpful session.')}</p></div></div>`).join(''):'<p class="muted">No reviews yet. Reviews appear after a student completes and rates a session.</p>'}catch(e){showMsg('msg',e.message)}}load();
$('form').onsubmit=async e=>{e.preventDefault();try{await api('/profile',{method:'PUT',body:{full_name:$('full_name').value,university:$('university').value,year:Number($('year').value)}});showMsg('msg','Profile updated successfully.','ok');await load()}catch(err){showMsg('msg',err.message)}};
</script></body></html>

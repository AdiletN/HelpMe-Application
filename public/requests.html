<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My activity — HelpMe</title><link rel="stylesheet" href="css/style.css"></head><body><div id="nav"></div><main class="main"><div class="container"><div class="page-head"><div><div class="eyebrow">YOUR LEARNING HISTORY</div><h1>My activity</h1><p class="sub">Track your requests, accepted sessions, and feedback.</p></div><a href="need-help.html" class="btn">+ New request</a></div><div class="tabs" id="roleTabs"><button class="tab on" data-role="mine">I asked for help</button><button class="tab" data-role="incoming">I'm helping</button></div><div class="tabs" id="statusTabs"></div><div id="msg" class="msg"></div><div id="list" class="stack"><div class="card muted">Loading your activity…</div></div></div></main><script src="js/api.js"></script><script>
requireLogin();renderNav('requests.html');let outgoing=[],incoming=[],role='mine',status='all';
const statuses=[['all','All'],['pending','Pending'],['accepted','Accepted'],['completed','Completed'],['cancelled','Closed']];
function render(){document.querySelectorAll('#roleTabs .tab').forEach(el=>{el.classList.toggle('on',role===el.dataset.role);el.onclick=()=>{role=el.dataset.role;status='all';render()}});$('statusTabs').innerHTML=statuses.map(([s,n])=>`<button class="tab ${status===s?'on':''}" data-status="${s}">${n}</button>`).join('');$('statusTabs').querySelectorAll('button').forEach(el=>el.onclick=()=>{status=el.dataset.status;render()});const rows=(role==='mine'?outgoing:incoming).filter(r=>status==='all'||(status==='cancelled'?['cancelled','rejected'].includes(r.status):r.status===status));$('list').innerHTML=rows.length?rows.map(r=>`<article class="card" id="request-${r.request_id}"><div class="req"><div class="req-main"><h3 class="req-title">${esc(r.course_name)} / ${esc(r.topic_name)}</h3><div class="meta">${requestMeta(r)}</div><p>${esc(r.description)}</p></div>${statusBadge(r.status)}</div><div class="req-footer">${role==='mine'?(r.helper_name?personMini(r.helper_name,'Your helper'):personMini('HelpMe Community','Waiting for a helper')):personMini(r.requester_name,'Student asking for help')}<div class="actions">${role==='mine'&&r.status==='accepted'?`<button class="btn small" data-action="complete" data-id="${r.request_id}">${icon('check')} Mark completed</button>`:''}${role==='mine'&&['pending','accepted'].includes(r.status)?`<button class="btn danger small" data-action="cancel" data-id="${r.request_id}">Cancel</button>`:''}${role==='mine'&&r.status==='completed'&&!r.my_rating?`<button class="btn soft small" data-rate="${r.request_id}">${icon('star')} Leave review</button>`:''}${role==='mine'&&r.my_rating?`<span class="stars">★ ${r.my_rating}/5 · Reviewed</span>`:''}${role==='incoming'&&r.status==='pending'?`<button class="btn small" data-action="accept" data-id="${r.request_id}">Accept</button><button class="btn danger small" data-action="reject" data-id="${r.request_id}">Decline</button>`:''}${role==='incoming'&&r.status==='accepted'?`<button class="btn danger small" data-action="withdraw" data-id="${r.request_id}">Withdraw</button>`:''}</div></div>${role==='mine'&&r.status==='completed'&&!r.my_rating?`<form class="review-form" id="rate-${r.request_id}" style="display:none;margin-top:18px;border-top:1px solid #e5eaf1;padding-top:15px"><b>Rate your helper</b><div class="row"><div><label>Stars</label><select name="rating" required><option value="5">★★★★★ Excellent</option><option value="4">★★★★☆ Very good</option><option value="3">★★★☆☆ Good</option><option value="2">★★☆☆☆ Fair</option><option value="1">★☆☆☆☆ Poor</option></select></div><div><label>Feedback (optional)</label><input name="feedback" maxlength="600" placeholder="How was your study session?"></div></div><button class="btn small mt12">Submit review</button></form>`:''}</article>`).join(''):emptyState('Nothing here yet',role==='mine'?'Your questions will appear here after you post a help request.':'After you accept a request, you will be able to track it here.',role==='mine'?'need-help.html':'feed.html',role==='mine'?'Ask a question':'Browse requests');$('list').querySelectorAll('[data-action]').forEach(btn=>btn.onclick=async()=>{const action=btn.dataset.action;if(['cancel','reject','withdraw','complete'].includes(action)&&!confirm(({cancel:'Cancel this request?',reject:'Decline this invitation?',withdraw:'Withdraw? The request will reopen for other helpers.',complete:'Confirm that this study session is complete?'})[action]))return;btn.disabled=true;try{await api('/requests/'+btn.dataset.id+'/'+action,{method:'POST'});await load()}catch(e){showMsg('msg',e.message);btn.disabled=false}});$('list').querySelectorAll('[data-rate]').forEach(btn=>btn.onclick=()=>{$('rate-'+btn.dataset.rate).style.display='block';btn.style.display='none'});$('list').querySelectorAll('.review-form').forEach(form=>form.onsubmit=async e=>{e.preventDefault();const id=form.id.replace('rate-','');const submit=form.querySelector('button');submit.disabled=true;try{await api('/requests/'+id+'/rate',{method:'POST',body:{rating:Number(form.elements.rating.value),feedback:form.elements.feedback.value}});showMsg('msg','Thanks for reviewing your helper!','ok');await load()}catch(err){showMsg('msg',err.message);submit.disabled=false}})}
async function load(){try{[outgoing,incoming]=await Promise.all([api('/requests/mine'),api('/requests/incoming')]);render()}catch(e){$('list').innerHTML=emptyState('Could not load activity',e.message)}}if(new URLSearchParams(location.search).has('created'))showMsg('msg','Your request is posted! Students in your major can now see it.','ok');load();
</script></body></html>
